<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Золотой час</title>
<style>html,body{margin:0;background:#1d1a24;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, OFF = 760, LH = H + OFF, TOTAL = 15.0;
const WL = 1150, RT = 1312, DF = 1450, FY = 1548;   // waterline, railing top, deck far edge, feet line
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = k => k * k * (3 - 2 * k);
const eo = k => 1 - Math.pow(1 - k, 3);
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const hsl = (h, s, l, a = 1) => `hsla(${h},${clamp(s, 0, 100)}%,${clamp(l, 0, 100)}%,${a})`;
const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const at = (o, a, len) => ({ x: o.x + len * Math.sin(a), y: o.y + len * Math.cos(a) });
const rotP = (p, o, a) => { const c = Math.cos(a), s = Math.sin(a), dx = p.x - o.x, dy = p.y - o.y; return { x: o.x + dx * c - dy * s, y: o.y + dx * s + dy * c }; };
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function smoothPath(g, pts, closed = true) {
  g.beginPath(); const n = pts.length;
  if (!closed) { g.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < n - 1; i++) g.quadraticCurveTo(pts[i].x, pts[i].y, (pts[i].x + pts[i + 1].x) / 2, (pts[i].y + pts[i + 1].y) / 2); g.lineTo(pts[n - 1].x, pts[n - 1].y); return; }
  g.moveTo((pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2);
  for (let i = 1; i <= n; i++) { const a = pts[i % n], b = pts[(i + 1) % n]; g.quadraticCurveTo(a.x, a.y, (a.x + b.x) / 2, (a.y + b.y) / 2); }
  g.closePath();
}
// painterly fill: base colour + side light from the left + brush strokes clipped to the shape
function paint(g, buildPath, bb, c, o = {}) {
  const [h, s, l] = c, r = o.rng || Math.random;
  g.save(); buildPath(g); g.fillStyle = hsl(h, s, l); g.fill(); g.clip();
  const gr = g.createLinearGradient(bb[0], 0, bb[0] + bb[2], 0);
  gr.addColorStop(0, hsl(h + 8, s + 12, l + (o.lit ?? 14), .55)); gr.addColorStop(.45, hsl(h, s, l, 0)); gr.addColorStop(1, hsl(235, 35, 18, o.shade ?? .35));
  g.fillStyle = gr; g.fillRect(bb[0] - 2, bb[1] - 2, bb[2] + 4, bb[3] + 4);
  if (o.ao !== 0) { const gv = g.createLinearGradient(0, bb[1], 0, bb[1] + bb[3]); gv.addColorStop(0, 'rgba(0,0,0,0)'); gv.addColorStop(1, hsl(250, 30, 15, o.ao ?? .25)); g.fillStyle = gv; g.fillRect(bb[0] - 2, bb[1] - 2, bb[2] + 4, bb[3] + 4); }
  const n = Math.min(900, (bb[2] * bb[3]) / (o.density ?? 160));
  g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const x = bb[0] + r() * bb[2], y = bb[1] + r() * bb[3], len = (o.len ?? 14) * (.5 + r()), a = (o.dir ?? Math.PI / 2) + (r() - .5) * (o.spread ?? .5);
    const lk = x < bb[0] + bb[2] * .3 ? 6 : 0;
    g.strokeStyle = hsl(h + (r() - .5) * 18, s + (r() - .5) * 14, l + lk + (r() - .5) * 16, .1 + r() * .2);
    g.lineWidth = (o.bw ?? 5) * (.5 + r());
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); g.stroke();
  }
  g.restore();
}
const rectPath = (x, y, w, h) => g => { g.beginPath(); g.rect(x, y, w, h); };

// =====================================================================
// STATIC LAYERS (pre-rendered once; world y + OFF = canvas y)
// =====================================================================
const R = mulberry(42);
// ---------- sky ----------
const sky = mk(W, LH);
{
  const g = sky.getContext('2d'); g.translate(0, OFF);
  const gr = g.createLinearGradient(0, -OFF, 0, WL + 200);
  gr.addColorStop(0, '#3f6f96'); gr.addColorStop(.3, '#6b9ab5'); gr.addColorStop(.55, '#c9b9a8'); gr.addColorStop(.75, '#f2c08a'); gr.addColorStop(.9, '#f7d39b'); gr.addColorStop(1, '#f9e2b4');
  g.fillStyle = gr; g.fillRect(0, -OFF, W, LH);
  // brushy sky texture
  for (let i = 0; i < 2600; i++) {
    const y = -OFF + R() * (LH - 300), x = R() * W, k = (y + OFF) / (WL + OFF);
    g.strokeStyle = hsl(lerp(205, 35, k * k) + (R() - .5) * 14, 40 + R() * 20, lerp(45, 82, k) + (R() - .5) * 12, .08);
    g.lineWidth = 6 + R() * 16; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 30 + R() * 60, y + (R() - .5) * 8); g.stroke();
  }
  // clouds: lavender bodies with gold-lit undersides (sun bottom-left)
  const clouds = [[180, -520, 1.15], [760, -380, 1.3], [420, -120, .9], [900, 80, .8], [140, 230, .7], [640, 420, .9], [980, 610, .6], [330, 640, .55]];
  for (const [cx, cy, s] of clouds) {
    const blobs = [];
    for (let i = 0; i < 26; i++) blobs.push({ x: cx + (R() - .5) * 360 * s, y: cy + (R() - .5) * 70 * s - Math.abs(R() - .5) * 60 * s, r: (36 + R() * 60) * s });
    const k = clamp((cy + OFF) / (WL + OFF));
    for (const b of blobs) { const gb = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r); gb.addColorStop(0, hsl(lerp(240, 300, k), 22, lerp(68, 74, k), .9)); gb.addColorStop(1, hsl(260, 20, 70, 0)); g.fillStyle = gb; g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.fill(); }
    for (const b of blobs) { const gb = g.createRadialGradient(b.x - b.r * .3, b.y + b.r * .45, 0, b.x - b.r * .3, b.y + b.r * .45, b.r * .8); gb.addColorStop(0, hsl(lerp(30, 22, k), 95, lerp(80, 72, k), .75)); gb.addColorStop(1, hsl(30, 90, 75, 0)); g.fillStyle = gb; g.beginPath(); g.arc(b.x - b.r * .3, b.y + b.r * .45, b.r * .8, 0, 7); g.fill(); }
    for (let i = 0; i < 220 * s; i++) { const b = blobs[Math.floor(R() * blobs.length)], a = R() * 6.28, rr = R() * b.r * .8; const x = b.x + Math.cos(a) * rr, y = b.y + Math.sin(a) * rr * .7; g.strokeStyle = y > b.y ? hsl(30, 90, 82, .22) : hsl(250, 25, 78, .2); g.lineWidth = 4 + R() * 8; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 14 + R() * 20, y + (R() - .5) * 4); g.stroke(); }
  }
}

// ---------- far city (back haze row, clock tower, front row, lighthouse, cranes) ----------
const far = mk(W, LH), farNight = mk(W, LH);
const CHIMNEYS = [];
{
  const g = far.getContext('2d'), gn = farNight.getContext('2d'); g.translate(0, OFF); gn.translate(0, OFF);
  const glowWin = (x, y, w, h) => { const gr = gn.createRadialGradient(x + w / 2, y + h / 2, 0, x + w / 2, y + h / 2, 26); gr.addColorStop(0, 'rgba(255,200,110,.55)'); gr.addColorStop(1, 'rgba(255,170,80,0)'); gn.fillStyle = gr; gn.fillRect(x - 24, y - 24, w + 48, h + 48); gn.fillStyle = '#ffd98c'; gn.fillRect(x, y, w, h); };
  // back row (hazy)
  let x = -30;
  while (x < W + 30) {
    const w = 46 + R() * 80, h = 170 + R() * 260, top = WL - h, sunK = clamp(1 - Math.abs(x - 200) / 600);
    const c = [lerp(270, 25, sunK * .7), 22 + sunK * 10, 64 + sunK * 8];
    const roof = R();
    const path = g2 => { g2.beginPath(); g2.moveTo(x, WL); g2.lineTo(x, top);
      if (roof < .35) { g2.lineTo(x + w / 2, top - 40 - R() * 50); } else if (roof < .5) { g2.lineTo(x + w * .45, top - 10); g2.lineTo(x + w * .5, top - 110 - R() * 60); g2.lineTo(x + w * .55, top - 10); } else if (roof < .65) { g2.arc(x + w / 2, top, w / 2, Math.PI, 0); }
      g2.lineTo(x + w, top); g2.lineTo(x + w, WL); g2.closePath(); };
    paint(g, path, [x, top - 170, w, h + 170], c, { rng: R, lit: 6, shade: .12, ao: .1, density: 260, bw: 6 });
    for (let wy = top + 20; wy < WL - 30; wy += 34) for (let wx = x + 10; wx < x + w - 14; wx += 22) if (R() < .25) glowWin(wx, wy, 7, 11);
    x += w - 6;
  }
  // haze over back row
  const hz = g.createLinearGradient(0, WL - 450, 0, WL); hz.addColorStop(0, 'rgba(250,215,170,.25)'); hz.addColorStop(1, 'rgba(250,215,170,.55)'); g.fillStyle = hz; g.fillRect(0, WL - 450, W, 450);
  // clock tower
  { const tx = 560, tw = 96, top = WL - 600;
    paint(g, rectPath(tx, top, tw, 600), [tx, top, tw, 600], [28, 30, 52], { rng: R, bw: 5 });
    paint(g, g2 => { g2.beginPath(); g2.moveTo(tx - 10, top); g2.lineTo(tx + tw + 10, top); g2.lineTo(tx + tw + 10, top + 18); g2.lineTo(tx - 10, top + 18); g2.closePath(); }, [tx - 10, top, tw + 20, 18], [25, 25, 40], { rng: R });
    // belfry + copper dome + spire
    paint(g, rectPath(tx + 8, top - 90, tw - 16, 90), [tx + 8, top - 90, tw - 16, 90], [30, 28, 48], { rng: R });
    for (let i = 0; i < 3; i++) { g.fillStyle = hsl(240, 30, 18); g.beginPath(); g.roundRect(tx + 16 + i * 24, top - 78, 16, 54, [8, 8, 0, 0]); g.fill(); }
    paint(g, g2 => { g2.beginPath(); g2.moveTo(tx + 2, top - 90); g2.quadraticCurveTo(tx + 6, top - 190, tx + tw / 2, top - 210); g2.quadraticCurveTo(tx + tw - 6, top - 190, tx + tw - 2, top - 90); g2.closePath(); }, [tx, top - 210, tw, 120], [165, 35, 45], { rng: R, lit: 20 });
    g.strokeStyle = hsl(30, 20, 25); g.lineWidth = 4; g.beginPath(); g.moveTo(tx + tw / 2, top - 210); g.lineTo(tx + tw / 2, top - 290); g.stroke();
    g.fillStyle = hsl(40, 70, 60); g.beginPath(); g.arc(tx + tw / 2, top - 292, 6, 0, 7); g.fill();
    // clock face
    const cx = tx + tw / 2, cy = top + 80;
    const cg = g.createRadialGradient(cx, cy, 0, cx, cy, 40); cg.addColorStop(0, '#fff3d6'); cg.addColorStop(1, '#e8c98f'); g.fillStyle = cg; g.beginPath(); g.arc(cx, cy, 36, 0, 7); g.fill();
    g.strokeStyle = hsl(30, 40, 22); g.lineWidth = 5; g.stroke();
    for (let i = 0; i < 12; i++) { const a = i / 12 * 6.283; g.lineWidth = 3; g.beginPath(); g.moveTo(cx + Math.cos(a) * 28, cy + Math.sin(a) * 28); g.lineTo(cx + Math.cos(a) * 33, cy + Math.sin(a) * 33); g.stroke(); }
    gn.save(); const ng = gn.createRadialGradient(cx, cy, 0, cx, cy, 90); ng.addColorStop(0, 'rgba(255,230,170,.75)'); ng.addColorStop(1, 'rgba(255,200,120,0)'); gn.fillStyle = ng; gn.fillRect(cx - 90, cy - 90, 180, 180); gn.restore();
    for (let wy = top + 160; wy < WL - 40; wy += 70) { g.fillStyle = hsl(235, 30, 22); g.fillRect(tx + tw / 2 - 9, wy, 18, 34); if (R() < .6) glowWin(tx + tw / 2 - 9, wy, 18, 34); }
    window.CLOCK = { cx, cy };
  }
  // industrial chimneys
  for (const [cx, ch] of [[150, 420], [300, 340]]) {
    paint(g, g2 => { g2.beginPath(); g2.moveTo(cx - 20, WL); g2.lineTo(cx - 13, WL - ch); g2.lineTo(cx + 13, WL - ch); g2.lineTo(cx + 20, WL); g2.closePath(); }, [cx - 20, WL - ch, 40, ch], [12, 35, 42], { rng: R, bw: 4 });
    g.fillStyle = hsl(10, 20, 25); g.fillRect(cx - 16, WL - ch - 8, 32, 12);
    CHIMNEYS.push({ x: cx, y: WL - ch - 10 });
  }
  // cranes at the harbour (right)
  g.strokeStyle = hsl(250, 18, 30); g.lineWidth = 3;
  for (const [cx, ch, dir] of [[820, 330, 1], [930, 280, -1]]) {
    g.beginPath(); g.moveTo(cx, WL); g.lineTo(cx, WL - ch); g.lineTo(cx + dir * 200, WL - ch + 10); g.moveTo(cx, WL - ch); g.lineTo(cx - dir * 60, WL - ch + 30); g.stroke();
    for (let y = WL; y > WL - ch; y -= 22) { g.beginPath(); g.moveTo(cx - 8, y); g.lineTo(cx + 8, y - 22); g.stroke(); }
    g.beginPath(); g.moveTo(cx + dir * 170, WL - ch + 9); g.lineTo(cx + dir * 170, WL - ch + 120); g.stroke();
    g.fillStyle = hsl(10, 40, 35); g.fillRect(cx + dir * 170 - 14, WL - ch + 120, 28, 20);
  }
  // front row: colourful townhouses along the water
  x = -20;
  const pal = [[32, 45, 58], [12, 45, 52], [175, 22, 48], [42, 35, 70], [200, 22, 55], [20, 30, 62], [350, 25, 55]];
  while (x < W + 20) {
    const skip = x > 520 && x < 660; // keep the clock tower visible
    const w = 70 + R() * 80, h = skip ? 90 + R() * 40 : 140 + R() * 170, top = WL - h, c = pal[Math.floor(R() * pal.length)];
    paint(g, rectPath(x, top, w, h), [x, top, w, h], c, { rng: R, density: 120 });
    // roof
    const rt = R(), rh = 30 + R() * 50, rc = [215 + R() * 20, 18, 34 + R() * 8];
    const roofPath = g2 => { g2.beginPath(); if (rt < .5) { g2.moveTo(x - 6, top); g2.lineTo(x + w / 2, top - rh); g2.lineTo(x + w + 6, top); } else { g2.moveTo(x - 6, top); g2.lineTo(x + 10, top - rh); g2.lineTo(x + w - 10, top - rh); g2.lineTo(x + w + 6, top); } g2.closePath(); };
    paint(g, roofPath, [x - 6, top - rh, w + 12, rh], rc, { rng: R, dir: 0, spread: .2, len: 18, lit: 18 });
    if (R() < .6) { const chx = x + w * (.2 + R() * .5); paint(g, rectPath(chx, top - rh - 20, 16, 40), [chx, top - rh - 20, 16, 40], [12, 35, 40], { rng: R }); }
    // windows with frames, some lit
    const cols = Math.max(1, Math.floor((w - 16) / 30)), gap = (w - cols * 18) / (cols + 1);
    for (let wy = top + 22; wy < WL - 40; wy += 50) for (let i = 0; i < cols; i++) {
      const wx = x + gap + i * (18 + gap);
      g.fillStyle = hsl(c[0], 20, c[2] - 25); g.fillRect(wx - 3, wy - 3, 24, 36);
      const wg = g.createLinearGradient(wx, wy, wx + 18, wy + 30); wg.addColorStop(0, hsl(30, 60, 78)); wg.addColorStop(1, hsl(215, 30, 35)); g.fillStyle = wg; g.fillRect(wx, wy, 18, 30);
      g.fillStyle = hsl(c[0], 15, c[2] - 30); g.fillRect(wx + 8, wy, 2, 30); g.fillRect(wx, wy + 13, 18, 2);
      if (R() < .45) glowWin(wx, wy, 18, 30);
      if (R() < .25) { g.fillStyle = hsl(5, 60, 45); for (let k = 0; k < 4; k++) { g.beginPath(); g.arc(wx + 2 + k * 5, wy + 34, 3.5, 0, 7); g.fill(); } }
    }
    // stone base / quay wall
    paint(g, rectPath(x, WL - 22, w, 22), [x, WL - 22, w, 22], [30, 15, 40], { rng: R, dir: 0, spread: .1 });
    x += w;
  }
  // lighthouse on the far right
  { const lx = 1030;
    paint(g, g2 => { g2.beginPath(); g2.moveTo(lx - 70, WL); g2.quadraticCurveTo(lx - 40, WL - 70, lx, WL - 80); g2.quadraticCurveTo(lx + 50, WL - 70, lx + 80, WL); g2.closePath(); }, [lx - 70, WL - 80, 150, 80], [25, 18, 35], { rng: R });
    paint(g, g2 => { g2.beginPath(); g2.moveTo(lx - 26, WL - 70); g2.lineTo(lx - 16, WL - 330); g2.lineTo(lx + 16, WL - 330); g2.lineTo(lx + 26, WL - 70); g2.closePath(); }, [lx - 26, WL - 330, 52, 260], [35, 25, 85], { rng: R, lit: 6 });
    g.save(); g.beginPath(); g.moveTo(lx - 26, WL - 70); g.lineTo(lx - 16, WL - 330); g.lineTo(lx + 16, WL - 330); g.lineTo(lx + 26, WL - 70); g.clip(); g.fillStyle = hsl(5, 55, 45); for (let y = WL - 300; y < WL - 70; y += 80) g.fillRect(lx - 40, y, 80, 34); g.restore();
    g.fillStyle = hsl(30, 30, 22); g.fillRect(lx - 24, WL - 342, 48, 12); g.fillStyle = hsl(45, 60, 75); g.fillRect(lx - 14, WL - 382, 28, 40); g.fillStyle = hsl(5, 50, 35); g.beginPath(); g.moveTo(lx - 20, WL - 382); g.lineTo(lx, WL - 410); g.lineTo(lx + 20, WL - 382); g.fill();
    window.LIGHT = { x: lx, y: WL - 362 };
  }
}

// ---------- water (reflections baked; ripples per frame) ----------
const water = mk(W, LH);
{
  const g = water.getContext('2d'); g.translate(0, OFF);
  const top = WL - 220, bot = DF + 420;
  const gr = g.createLinearGradient(0, WL, 0, bot); gr.addColorStop(0, '#e9c393'); gr.addColorStop(.25, '#8fa3a8'); gr.addColorStop(.6, '#3e6577'); gr.addColorStop(1, '#22394a');
  g.fillStyle = gr; g.fillRect(0, top, W, bot - top);
  // mirrored city, squashed and blurred
  g.save(); g.globalAlpha = .55; g.filter = 'blur(3px)'; g.translate(0, WL); g.scale(1, -.75); g.drawImage(far, 0, 0, W, WL + OFF, 0, -(WL + OFF) + 0, W, WL + OFF); g.restore();
  g.save(); g.globalAlpha = .4; g.globalCompositeOperation = 'lighter'; g.filter = 'blur(4px)'; g.translate(0, WL); g.scale(1, -.75); g.drawImage(farNight, 0, 0, W, WL + OFF, 0, -(WL + OFF), W, WL + OFF); g.restore();
  // depth tint
  const dt = g.createLinearGradient(0, WL, 0, DF); dt.addColorStop(0, 'rgba(240,200,150,.15)'); dt.addColorStop(1, 'rgba(30,60,80,.55)'); g.fillStyle = dt; g.fillRect(0, WL, W, bot - WL);
  // horizontal ripple strokes
  for (let i = 0; i < 1400; i++) {
    const y = WL + Math.pow(R(), 1.4) * (DF - WL + 60), x = R() * W, k = (y - WL) / (DF - WL);
    g.strokeStyle = R() < .5 ? hsl(35, 70, 80, .18) : hsl(210, 40, 25, .22); g.lineWidth = 1.5 + k * 3; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 20 + k * 60, y); g.stroke();
  }
}

// ---------- quay: railing + cobbled deck ----------
const quay = mk(W, H);
const RAIL_POSTS = [];
{
  const g = quay.getContext('2d');
  // deck
  paint(g, rectPath(0, DF, W, H - DF), [0, DF, W, H - DF], [28, 22, 50], { rng: R, density: 400, ao: .45, lit: 6 });
  let y = DF + 6, row = 0;
  while (y < H) {
    const k = (y - DF) / (H - DF), rh = 14 + k * 70, sw = 34 + k * 120;
    for (let x = -((row % 2) * sw / 2); x < W; x += sw) {
      const l = 44 + R() * 12 - k * 6, hh = 24 + R() * 10;
      g.fillStyle = hsl(hh, 20, l); g.beginPath(); g.roundRect(x + 3, y + 2, sw - 6, rh - 5, rh * .35); g.fill();
      g.fillStyle = hsl(38, 60, 72, .35); g.beginPath(); g.roundRect(x + 5, y + 3, sw * .55, rh * .25, rh * .2); g.fill();
      g.fillStyle = hsl(240, 25, 18, .25); g.beginPath(); g.roundRect(x + 5, y + rh * .65, sw - 10, rh * .25, rh * .2); g.fill();
    }
    y += rh; row++;
  }
  // warm sunlight sweep across deck + long shadow band near the railing
  const sl = g.createLinearGradient(0, 0, W, 0); sl.addColorStop(0, 'rgba(255,190,110,.32)'); sl.addColorStop(1, 'rgba(80,60,120,.25)'); g.fillStyle = sl; g.fillRect(0, DF, W, H - DF);
  const sh = g.createLinearGradient(0, DF, 0, DF + 70); sh.addColorStop(0, 'rgba(30,20,40,.45)'); sh.addColorStop(1, 'rgba(30,20,40,0)'); g.fillStyle = sh; g.fillRect(0, DF, W, 70);
  // stone curb
  paint(g, rectPath(0, DF - 26, W, 30), [0, DF - 26, W, 30], [32, 18, 62], { rng: R, dir: 0, spread: .1, lit: 10 });
  g.fillStyle = hsl(38, 60, 80, .5); g.fillRect(0, DF - 26, W, 3);
  // iron railing
  const iron = hsl(240, 12, 16), ironLit = hsl(36, 70, 60, .8);
  for (let x = 6; x < W; x += 18) { g.fillStyle = iron; g.fillRect(x, RT + 8, 5, DF - 26 - RT - 8); g.fillStyle = ironLit; g.fillRect(x, RT + 8, 1.5, DF - 26 - RT - 8); }
  for (let x = 6; x < W; x += 18) { g.strokeStyle = iron; g.lineWidth = 3; g.beginPath(); g.arc(x + 2.5, RT + 64, 7, 0, 7); g.stroke(); }
  for (let x = 40; x < W; x += 140) {
    RAIL_POSTS.push(x);

  if (on > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; const fl = 1 + Math.sin(t * 17) * .03 + Math.sin(t * 7.3) * .03; const lg = ctx.createRadialGradient(LAMP.x, LAMP.y, 0, LAMP.x, LAMP.y, 420 * fl); lg.addColorStop(0, `rgba(255,210,130,${.8 * on})`); lg.addColorStop(.15, `rgba(255,180,90,${.35 * on})`); lg.addColorStop(1, 'rgba(255,150,60,0)'); ctx.fillStyle = lg; ctx.fillRect(LAMP.x - 440, LAMP.y - 440, 880, 880); ctx.restore(); }
  ctx.restore();
  // dust motes in the light
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 46; i++) { const x = (hash(i) * W + t * (12 + hash(i + 1) * 30) * (1 + wd * 4)) % W, y = (hash(i + 2) * H - t * (8 + hash(i + 3) * 10) + H) % H, rr = 1.5 + hash(i + 4) * 3.5, a = .25 + .25 * Math.sin(t * 2 + i);
    const mg = ctx.createRadialGradient(x, y, 0, x, y, rr * 3); mg.addColorStop(0, `rgba(255,230,180,${a})`); mg.addColorStop(1, 'rgba(255,230,180,0)'); ctx.fillStyle = mg; ctx.fillRect(x - rr * 3, y - rr * 3, rr * 6, rr * 6); }
  ctx.restore();
  // foreground ivy (fast parallax → sweeps past during the descent)
  ctx.drawImage(ivy, 0, -60 + cy * 1.35);
  // grade: warm → rosy dusk, texture, vignette
  ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = `rgba(255,170,110,${.22})`; ctx.fillRect(0, 0, W, H); ctx.restore();
  if (D > 0) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = `rgba(150,120,190,${.35 * D})`; ctx.fillRect(0, 0, W, H); ctx.restore();
    // keep the lamp punchy after the multiply
    if (on > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; const ly = LAMP.y + cy * 1.08; const lg = ctx.createRadialGradient(LAMP.x, ly, 0, LAMP.x, ly, 260); lg.addColorStop(0, `rgba(255,200,120,${.35 * on})`); lg.addColorStop(1, 'rgba(255,160,80,0)'); ctx.fillStyle = lg; ctx.fillRect(LAMP.x - 260, ly - 260, 520, 520); ctx.restore(); } }
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .55; ctx.drawImage(tex, 0, 0); ctx.restore();
  ctx.drawImage(vig, 0, 0);
  // title
  const tk = P(t, 12.4, 13.2) * (1 - P(t, 14.3, 14.9));
  if (tk > 0) { ctx.save(); ctx.globalAlpha = tk; ctx.textAlign = 'center'; ctx.font = 'italic 700 96px "DejaVu Serif"'; ctx.shadowColor = 'rgba(60,20,40,.7)'; ctx.shadowBlur = 24;
    ctx.fillStyle = '#ffe2a8'; ctx.fillText('Золотой час', W / 2, 560 + (1 - eo(tk)) * 30);
    ctx.font = 'italic 400 40px "DejaVu Serif"'; ctx.fillStyle = 'rgba(255,235,205,.9)'; ctx.fillText('почта доставлена вовремя', W / 2, 640 + (1 - eo(tk)) * 30); ctx.restore(); }
  const fade = Math.max(1 - P(t, 0, .7), P(t, TOTAL - .6, TOTAL));
  if (fade > 0) { ctx.fillStyle = `rgba(20,14,24,${fade})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- sound events ----------
const SFX = [];
{ // boot steps from the walk/run phase
  let last = null;
  for (let t = 2.3; t < 13.5; t += 1 / 240) {
    let ph = null;
    if (t < 5.3) ph = (courierX(t) - X0) / 48; else if (t >= 6.08 && t < 6.7) ph = 14 + (courierX(t) - courierX(6.05)) / 30; else if (t >= 10.45) ph = (courierX(t) - courierX(10.4)) / 48 + Math.PI;
    if (ph === null) { last = null; continue; }
    const k = Math.floor(ph / Math.PI + .5); if (last !== null && k !== last && courierX(t) > -120 && courierX(t) < 1150) SFX.push([+t.toFixed(3), 'boot', .55]); last = k;
  }
}
SFX.push([1.2, 'gull', .5], [3.6, 'gull', .4], [4.85, 'gust', 1], [5.6, 'flap', .8], [5.62, 'whoosh', .5], [6.72, 'swish', .8], [T_CATCH, 'catch', 1],
  [7.36, 'boot', 1], [7.4, 'boot', .9], [7.38, 'flap', .9], [7.45, 'flap', .7], [7.5, 'gull', .6], [7.75, 'gull', .45], [8.48, 'catch', .5],
  [9.1, 'bell', .55], [9.6, 'catch', .4], [10.6, 'lamp', .9]);

window.frameJPEG = t => { draw(t); return cv.toDataURL('image/jpeg', .92); };
window.META = { TOTAL, SFX, MUSIC: 'city' };
window.READY = Promise.all([document.fonts.load('italic 700 96px "DejaVu Serif"')]);
if (!location.search.includes('render')) { const s = performance.now(); const loop = n => { draw(((n - s) / 1000) % TOTAL); requestAnimationFrame(loop); }; window.READY.then(() => requestAnimationFrame(loop)); }
