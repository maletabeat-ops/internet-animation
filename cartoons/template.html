<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Шаблон сцены</title>
<style>html,body{margin:0;background:#111;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
</head><body><canvas id="c"></canvas>
<script>
// Шаблон новой сцены. Скопируй в <name>.html и замени блок SCENE.
// Формат: ?fmt=v (1080×1920, по умолчанию) или ?fmt=h (1920×1080) — задаётся FMT=h при сборке.
const FMT = new URLSearchParams(location.search).get('fmt') === 'h' ? 'h' : 'v';
const W = FMT === 'h' ? 1920 : 1080, H = FMT === 'h' ? 1080 : 1920, U = Math.min(W, H) / 1080; // U — единица масштаба
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
const VO = .6;                                            // голос начинается через VO секунд
const WD = /*WORDS*/null || { dur: 6, words: [] };        // render.mjs подставляет <name>_words.json
const TOTAL = VO + WD.dur + 1.8;

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = k => k * k * (3 - 2 * k);
const eo = k => 1 - Math.pow(1 - k, 3);
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eback = k => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };
const win = (t, a, b, fi = .2, fo = .2) => clamp(Math.min(P(t, a, a + fi), 1 - P(t, b - fo, b)));

// ---------- озвучка: время слова и субтитры по 1–3 слова ----------
const WORDS = WD.words.map(w => ({ ...w, t0: w.t0 + VO, t1: w.t1 + VO }));
function WT(sub, nth = 1, fb = 0) { let k = 0; for (const w of WORDS) if (w.w.toLowerCase().includes(sub)) { if (++k === nth) return w.t0; } return fb; }
const GROUPS = []; { let g = null;
  WORDS.forEach((w, i) => { const prev = WORDS[i - 1];
    if (!g || g.words.length >= 3 || /[.,!?:…]$/.test(prev.w) || w.t0 - prev.t1 > .35) { g = { words: [], t0: w.t0 }; GROUPS.push(g); }
    g.words.push(w.w.replace(/\.\.\./, '').replace(/[.,:…]+$/, '')); g.t1 = w.t1; });
  GROUPS.forEach((g, i) => { g.end = i + 1 < GROUPS.length ? Math.min(GROUPS[i + 1].t0, g.t1 + .6) : g.t1 + .8; }); }
function captions(t) {
  const gr = GROUPS.find(q => t >= q.t0 && t < q.end); if (!gr) return;
  const s = gr.words.join(' ').toUpperCase(), k = eback(P(t, gr.t0, gr.t0 + .16)), size = 70 * U;
  ctx.save(); ctx.translate(W / 2, H * (FMT === 'h' ? .87 : .86)); ctx.font = `900 ${size}px Inter`;
  const fit = Math.min(1, W * .88 / ctx.measureText(s).width); ctx.scale(k * fit, k * fit);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.lineWidth = size * .23; ctx.strokeStyle = '#000'; ctx.strokeText(s, 0, 0);
  ctx.fillStyle = '#fff'; ctx.fillText(s, 0, 0); ctx.restore();
}

// ---------- камера: ключи + параллакс по глубине ----------
// Мир сцены задаётся в координатах кадра W×H. Ключ: [время, x, y, zoom, наклон(рад)] — x,y = центр взгляда.
const CAM = [[0, W / 2, H / 2, 1.0, 0], [3, W * .55, H * .5, 1.15, .02], [6, W * .45, H * .55, 1.3, -.015], [TOTAL, W * .5, H * .5, 1.1, 0]];
function cam(t) { let i = 0; while (i < CAM.length - 2 && t > CAM[i + 1][0]) i++; const a = CAM[i], b = CAM[i + 1], k = eio(P(t, a[0], b[0]));
  return { x: lerp(a[1], b[1], k), y: lerp(a[2], b[2], k), z: lerp(a[3], b[3], k), r: lerp(a[4], b[4], k) }; }
// depth: 1 — план действия; <1 — дальше (меньше сдвиг и зум); >1 — передний план (быстрее камеры)
function layer(c, depth, fn) {
  const z = 1 + (c.z - 1) * depth, x = W / 2 + (c.x - W / 2) * depth, y = H / 2 + (c.y - H / 2) * depth;
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(c.r * depth); ctx.scale(z, z); ctx.translate(-x, -y); fn(); ctx.restore();
}

// =================== SCENE (замени на свою) ===================
function scene(t) {
  const c = cam(t);
  layer(c, 0, () => { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#6aa9e9'); g.addColorStop(1, '#f6dfb0'); ctx.fillStyle = g; ctx.fillRect(-W, -H, W * 3, H * 3); });
  layer(c, .35, () => { ctx.fillStyle = '#8fb3a0'; for (let i = -3; i < 8; i++) { ctx.beginPath(); ctx.ellipse(i * W * .3, H * .66, W * .25, H * .12, 0, Math.PI, 0); ctx.fill(); } });
  layer(c, .7, () => { ctx.fillStyle = '#5f8f62'; for (let i = -3; i < 8; i++) { ctx.beginPath(); ctx.ellipse(i * W * .22 + 80, H * .74, W * .16, H * .1, 0, Math.PI, 0); ctx.fill(); } });
  layer(c, 1, () => {
    ctx.fillStyle = '#c9a46a'; ctx.fillRect(-W, H * .74, W * 3, H);
    const bx = W * .2 + (t * 160 * U) % (W * .6), by = H * .74 - 60 * U - Math.abs(Math.sin(t * 4)) * 260 * U, sq = 1 - .25 * Math.max(0, 1 - Math.abs(Math.sin(t * 4)) * 6);
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(bx, H * .74 + 4, 60 * U, 12 * U, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(bx, by + 60 * U * (1 - sq)); ctx.scale(2 - sq, sq); ctx.fillStyle = '#e8473f'; ctx.beginPath(); ctx.arc(0, 0, 60 * U, 0, 7); ctx.fill(); ctx.restore();
  });
  layer(c, 1.3, () => { ctx.fillStyle = '#2f4a32'; ctx.beginPath(); ctx.ellipse(W * .05, H * 1.02, W * .25, H * .1, 0, 0, 7); ctx.fill(); });
}
const SFX = [];                       // [время, звук, громкость] — имена звуков в sfx.py
const MUSIC = 'uke';                   // uke | city | paris | rome
// ==============================================================

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  scene(t);
  captions(t);
  const fade = Math.max(1 - P(t, 0, .4), P(t, TOTAL - .5, TOTAL)); if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}
// motion blur: среднее нескольких подкадров внутри «выдержки» (MB=1 — выключено)
const MB = 3, SHUTTER = .5 / 30, acc = document.createElement('canvas'); acc.width = W; acc.height = H; const actx = acc.getContext('2d');
window.frameJPEG = t => {
  if (MB < 2) { draw(t); return cv.toDataURL('image/jpeg', .92); }
  for (let i = 0; i < MB; i++) { draw(t + (i / (MB - 1) - .5) * SHUTTER); actx.globalAlpha = 1 / (i + 1); actx.drawImage(cv, 0, 0); }
  actx.globalAlpha = 1; return acc.toDataURL('image/jpeg', .92);
};
window.META = { TOTAL, SFX, MUSIC, VO, W, H };
window.READY = document.fonts.load('900 70px Inter');
if (!location.search.includes('render')) { const s = performance.now(); const loop = n => { draw(((n - s) / 1000) % TOTAL); requestAnimationFrame(loop); }; window.READY.then(() => requestAnimationFrame(loop)); }
</script></body></html>
