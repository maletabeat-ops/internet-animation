<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Стикмен и мяч</title>
<style>html,body{margin:0;background:#f7f2e6;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, GROUND = 1380, TOTAL = 16.2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const INK = '#23201d', PAPER = '#f7f2e6';
const S = 1.12, L = { torso: 190 * S, neck: 24 * S, head: 50 * S, ua: 95 * S, fa: 90 * S, th: 122 * S, sh: 122 * S };

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = k => k * k * (3 - 2 * k);
const eo = k => 1 - Math.pow(1 - k, 3);
const ei = k => k * k * k;
const eback = k => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };
const at = (o, a, len) => ({ x: o.x + len * Math.sin(a), y: o.y + len * Math.cos(a) });

// ---------- hand-drawn lines (line boil 12 fps) ----------
let sid = 0, boil = 0;
const jit = k => (hash(sid * 13.71 + k * 7.31 + boil * 91.17) - .5) * 2;
function wpath(pts, amp = 2.2, closed = false) {
  sid++;
  const out = [];
  const seq = closed ? [...pts, pts[0]] : pts;
  for (let i = 0; i < seq.length - 1; i++) {
    const a = seq[i], b = seq[i + 1], n = Math.max(1, Math.round(Math.hypot(b.x - a.x, b.y - a.y) / 28));
    for (let j = 0; j < n; j++) out.push({ x: lerp(a.x, b.x, j / n), y: lerp(a.y, b.y, j / n) });
  }
  if (!closed) out.push(seq[seq.length - 1]);
  out.forEach((p, i) => { p.x += jit(i) * amp; p.y += jit(i + 500) * amp; });
  ctx.beginPath(); ctx.moveTo(out[0].x, out[0].y);
  for (let i = 1; i < out.length - 1; i++) ctx.quadraticCurveTo(out[i].x, out[i].y, (out[i].x + out[i + 1].x) / 2, (out[i].y + out[i + 1].y) / 2);
  ctx.lineTo(out[out.length - 1].x, out[out.length - 1].y);
  if (closed) ctx.closePath();
}
function wline(pts, w = 9, col = INK, amp = 2.2) { wpath(pts, amp); ctx.lineWidth = w; ctx.strokeStyle = col; ctx.lineCap = ctx.lineJoin = 'round'; ctx.stroke(); }
function circlePts(cx, cy, r, n = 16, rot = 0) { return Array.from({ length: n }, (_, i) => ({ x: cx + r * Math.cos(rot + i / n * Math.PI * 2), y: cy + r * Math.sin(rot + i / n * Math.PI * 2) })); }
function wcircle(cx, cy, r, fill, w = 9, col = INK) {
  wpath(circlePts(cx, cy, r, Math.max(10, Math.round(r / 4))), 1.8, true);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (w) { ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke(); }
}
function star(cx, cy, r, rot, fill) {
  const pts = Array.from({ length: 10 }, (_, i) => { const rr = i % 2 ? r * .45 : r, a = rot + i / 10 * Math.PI * 2 - Math.PI / 2; return { x: cx + rr * Math.cos(a), y: cy + rr * Math.sin(a) }; });
  wpath(pts, 1.5, true); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
}

// ---------- paper ----------
const paper = document.createElement('canvas'); paper.width = W; paper.height = H;
{
  const g = paper.getContext('2d'); g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
  let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 60000; i++) { g.fillStyle = `rgba(90,70,40,${r() * .07})`; g.fillRect(r() * W, r() * H, 1 + r() * 2, 1 + r() * 2); }
  g.strokeStyle = 'rgba(80,130,200,.28)'; g.lineWidth = 2;
  for (let y = 210; y < H; y += 66) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.strokeStyle = 'rgba(220,70,70,.4)'; g.beginPath(); g.moveTo(118, 0); g.lineTo(118, H); g.stroke();
  const v = g.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1200); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(80,60,30,.22)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

// ---------- poses ----------
const STAND = { lean: 0, head: 0, aL: [-0.14, 0.1], aR: [0.14, -0.1], lL: [-0.07, -0.07], lR: [0.07, 0.07], look: 1, lift: 0 };
function mixPose(a, b, k) {
  const o = {};
  for (const key in a) o[key] = Array.isArray(a[key]) ? a[key].map((v, i) => lerp(v, b[key][i], k)) : typeof a[key] === 'number' ? lerp(a[key], b[key] ?? a[key], k) : (k < .5 ? a[key] : b[key]);
  return o;
}
const with_ = (o) => ({ ...STAND, ...o });
function walkPose(p) {
  const A = .3, s = Math.sin(p), c = Math.cos(p), s2 = Math.sin(p + Math.PI), c2 = Math.cos(p + Math.PI);
  return with_({ lean: .07, head: .04,
    lL: [A * s, A * s - .85 * Math.max(0, c)], lR: [A * s2, A * s2 - .85 * Math.max(0, c2)],
    aL: [-.42 * s, -.42 * s + .35], aR: [-.42 * s2, -.42 * s2 + .35] });
}
// walk-in: constant speed, ease-out at the end; phase is tied to distance so feet don't slide
const X0 = -230, V = 188, TW = 3.1, TE = .5;
const walkX = t => t < TW ? X0 + V * t : X0 + V * TW + V * TE / 2 * (1 - Math.pow(1 - P(t, TW, TW + TE), 2));
const XS = walkX(99);

const K = {
  surprise: with_({ lean: -.12, head: -.15, aL: [-.5, -.9], aR: [.5, .9], lL: [-.12, -.12], lR: [.12, .12], look: 1 }),
  wind: with_({ lean: .12, head: .1, aL: [.7, 1.1], aR: [-.6, -.3], lL: [-.05, -.05], lR: [-.55, -1.7], look: 1 }),
  kick: with_({ lean: -.25, head: -.1, aL: [-.7, -.4], aR: [.9, 1.3], lL: [-.12, -.12], lR: [1.25, 1.3], look: 1 }),
  lookUp: with_({ lean: -.14, head: -.5, aL: [-.75, .95], aR: [2.0, 3.6], lL: [-.1, -.1], lR: [.12, .12], look: 1 }),
  lie: with_({ lean: 0, head: -.25, aL: [3.35, 3.25], aR: [2.95, 3.1], lL: [-.25, -1.3], lR: [-.05, -1.0], look: 1 }),
  shrug: with_({ lean: 0, head: .22, aL: [-.85, -2.3], aR: [.85, 2.3], lL: [-.1, -.1], lR: [.1, .1], look: 0 }),
  wave: with_({ lean: 0, head: -.08, aL: [-.15, .05], aR: [2.35, 2.9], lL: [-.1, -.1], lR: [.1, .1], look: 0 }),
};
const KEYS = [ // [time, pose, ease]
  [3.62, STAND], [3.92, K.surprise], [4.3, K.surprise], [4.6, STAND], [4.75, STAND], [5.25, K.wind], [5.42, K.wind],
  [5.58, K.kick], [6.1, K.kick], [6.7, STAND], [7.0, STAND], [7.4, K.lookUp], [9.0, K.lookUp],
  [11.4, K.lie], [12.0, STAND], [12.25, STAND], [12.6, K.shrug], [13.4, K.shrug], [13.75, STAND], [14.0, K.wave], [16.2, K.wave],
];
const T_BONK = 9.0, T_FALL0 = 9.08, T_FALL1 = 9.55, T_UP0 = 11.25, T_UP1 = 12.05;

function pose(t) {
  let p;
  if (t < 3.62) {
    const x = walkX(t), w = ss(P(t, 3.15, 3.6));
    p = mixPose(walkPose((x - X0) / (45 * S)), STAND, w);
  } else {
    let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1][0]) i++;
    const [ta, a] = KEYS[i], [tb, b] = KEYS[i + 1];
    p = mixPose(a, b, ss(P(t, ta, tb)));
  }
  p = { ...p, x: walkX(t), rot: 0 };
  if (t > 3.92 && t < 4.3) p.lift = 26 * Math.sin(P(t, 3.92, 4.22) * Math.PI);
  if (t >= T_BONK && t < T_UP1) { // fall backwards, lie, twitch, get up
    const fall = t < T_FALL1 ? ei(P(t, T_FALL0, T_FALL1)) : 1;
    const up = eback(P(t, T_UP0, T_UP1));
    const bounce = t > T_FALL1 && t < T_FALL1 + .5 ? .08 * Math.sin(P(t, T_FALL1, T_FALL1 + .5) * Math.PI) : 0;
    p.rot = Math.PI / 2 * (fall - bounce) * (1 - up);
    const lieK = P(t, T_FALL1 - .2, T_FALL1) * (1 - P(t, T_UP0, T_UP0 + .3));
    p = { ...mixPose(p, K.lie, lieK), x: p.x, rot: p.rot };
    if (t > 10.0 && t < 11.0) { const tw = Math.sin(t * 40) * .18 * Math.sin(P(t, 10, 11) * Math.PI); p.lL = [p.lL[0] + tw, p.lL[1] - tw]; p.lR = [p.lR[0] - tw, p.lR[1] + tw]; }
  }
  if (t > 14.0) p.aR = [p.aR[0], 2.9 + .45 * Math.sin((t - 14) * 13)];
  return p;
}
function rig(p) {
  const depth = l => L.th * Math.cos(l[0]) + L.sh * Math.cos(l[1]);
  const hip = { x: p.x, y: GROUND - Math.max(depth(p.lL), depth(p.lR)) - p.lift };
  const sh = at(hip, Math.PI + p.lean, L.torso), neck = at(sh, Math.PI + p.lean + p.head * .5, L.neck);
  const head = at(neck, Math.PI + p.lean + p.head, L.head);
  const limb = (o, a, l1, l2) => { const m = at(o, a[0], l1); return [o, m, at(m, a[1], l2)]; };
  return { hip, sh, neck, head, aL: limb(sh, p.aL, L.ua, L.fa), aR: limb(sh, p.aR, L.ua, L.fa), lL: limb(hip, p.lL, L.th, L.sh), lR: limb(hip, p.lR, L.th, L.sh) };
}
function headWorld(t) { const p = pose(t), r = rig(p); return r.head; }

// ---------- ball ----------
const BR = 46;
const KICK_AT = 5.55;
function ball(t) {
  if (t < 3.0) return null;
  if (t < 4.5) { const k = eo(P(t, 3.0, 4.5)), x = lerp(1250, 590, k); return { x, y: GROUND - BR, rot: -(x - 590) / BR }; }
  if (t < KICK_AT) return { x: 590, y: GROUND - BR, rot: 0 };
  if (t < 6.35) { const k = P(t, KICK_AT, 6.35); return { x: lerp(590, 1050, k), y: lerp(GROUND - BR, -200, eo(k)) - 0 * k, rot: k * 9 }; }
  if (t < 8.45) return null;
  const hb = headWorld(T_BONK); const top = { x: hb.x + 6, y: hb.y - L.head - BR + 6 };
  if (t < T_BONK) { const k = ei(P(t, 8.45, T_BONK)); return { x: lerp(top.x + 60, top.x, k), y: lerp(-150, top.y, k), rot: k * 6 }; }
  const land = { x: 200, y: GROUND - BR };
  if (t < 9.85) { const k = P(t, T_BONK, 9.85); return { x: lerp(top.x, land.x, k), y: lerp(top.y, land.y, k) - Math.sin(k * Math.PI) * 330 + 0, rot: 6 - k * 8, squash: t < T_BONK + .07 }; }
  if (t < 10.35) { const k = P(t, 9.85, 10.35); return { x: lerp(200, 150, k), y: land.y - Math.sin(k * Math.PI) * 90, rot: -2 - k * 2 }; }
  const k = eo(P(t, 10.35, 11.2)); return { x: lerp(150, 120, k), y: land.y, rot: -4 - k * 1 };
}
function drawBall(b) {
  ctx.save(); ctx.translate(b.x, b.y); if (b.squash) ctx.scale(1.2, .8);
  wcircle(0, 0, BR, '#e8473f', 7);
  ctx.save(); ctx.rotate(b.rot);
  wline([{ x: -BR * .85, y: -BR * .3 }, { x: 0, y: -BR * .05 }, { x: BR * .85, y: -BR * .3 }], 5);
  wline([{ x: -BR * .4, y: BR * .2 }, { x: BR * .2, y: BR * .55 }], 4, 'rgba(255,255,255,.7)');
  ctx.restore(); ctx.restore();
}

// ---------- stickman ----------
function drawMan(t, p) {
  const r = rig(p);
  const lying = Math.abs(p.rot) > .9;
  // shadow
  const hgt = p.lift + (p.rot ? 0 : 0);
  ctx.save(); ctx.fillStyle = 'rgba(40,30,20,.13)'; ctx.beginPath();
  ctx.ellipse(p.x + Math.sin(p.rot) * 270, GROUND + 6, 100 + Math.abs(Math.sin(p.rot)) * 200 - hgt * .8, 13, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();

  ctx.save();
  const lyY = Math.abs(Math.sin(p.rot)) * (L.head - 4);
  ctx.translate(p.x, GROUND - lyY); ctx.rotate(p.rot); ctx.translate(-p.x, -GROUND);
  wline(r.lL); wline(r.lR);
  wline([r.hip, r.sh, r.neck]);
  wline(r.aL); wline(r.aR);
  // head + face
  const h = r.head, dizzy = t > T_BONK && t < 11.6;
  wcircle(h.x, h.y, L.head, PAPER, 9);
  ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(p.lean + p.head);
  const lx = p.look * 15;
  if (dizzy) {
    for (const ex of [-17, 17]) { wline([{ x: lx + ex - 8, y: -14 }, { x: lx + ex + 8, y: 2 }], 5); wline([{ x: lx + ex + 8, y: -14 }, { x: lx + ex - 8, y: 2 }], 5); }
    wline([{ x: lx - 14, y: 22 }, { x: lx - 4, y: 17 }, { x: lx + 5, y: 23 }, { x: lx + 14, y: 18 }], 4.5);
  } else {
    const blink = (t % 3.1) > 2.95 ? .15 : 1;
    const surprised = t > 3.9 && t < 4.6, happy = t > 13.8;
    for (const ex of [-16, 16]) { ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(lx + ex, -8, 5.5, (surprised ? 10 : 8) * blink, 0, 0, Math.PI * 2); ctx.fill(); }
    if (surprised) wcircle(lx, 20, 8, null, 4.5);
    else if (t > 12.4 && t < 13.6) wline([{ x: lx - 12, y: 21 }, { x: lx + 12, y: 17 }], 4.5);
    else { ctx.beginPath(); ctx.arc(lx, happy ? 8 : 12, happy ? 18 : 13, .2 * Math.PI, .8 * Math.PI); ctx.lineWidth = 4.5; ctx.strokeStyle = INK; ctx.stroke(); if (happy) { ctx.fillStyle = 'rgba(232,71,63,.25)'; for (const ex of [-30, 30]) { ctx.beginPath(); ctx.ellipse(lx + ex, 12, 9, 5, 0, 0, 7); ctx.fill(); } } }
  }
  ctx.restore();
  ctx.restore();
  return { r, lyY };
}

// ---------- scene extras ----------
function bgDoodles(t) {
  // sun
  const sx = 860, sy = 420;
  wcircle(sx, sy, 70, '#ffd34d', 7);
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + t * .25; wline([{ x: sx + 98 * Math.cos(a), y: sy + 98 * Math.sin(a) }, { x: sx + 135 * Math.cos(a), y: sy + 135 * Math.sin(a) }], 6); }
  // clouds
  for (const [cx0, cy, s, v] of [[260, 560, 1, 14], [700, 760, .75, 22]]) {
    const cx = ((cx0 + t * v) % 1400) - 150;
    wpath(cloudPts(cx, cy, s), 2, true);
    ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
  }
  // ground + grass
  wline([{ x: -20, y: GROUND }, { x: W + 20, y: GROUND }], 8);
  for (const gx of [70, 300, 520, 760, 980]) for (const d of [-10, 0, 10]) wline([{ x: gx + d * .6, y: GROUND }, { x: gx + d * 1.6, y: GROUND - 26 + Math.abs(d) }], 4.5);
  // hatching under ground
  ctx.save(); ctx.globalAlpha = .35;
  for (let x = -40; x < W; x += 34) wline([{ x, y: GROUND + 60 }, { x: x + 50, y: GROUND + 14 }], 3);
  ctx.restore();
}
function cloudPts(cx, cy, s) {
  const pts = [];
  const bumps = [[-110, 0, 50], [-55, -40, 55], [15, -55, 62], [80, -30, 50], [115, 5, 40]];
  for (const [bx, by, br] of bumps) for (let i = 0; i <= 6; i++) { const a = Math.PI + i / 6 * Math.PI; pts.push({ x: cx + (bx + br * Math.cos(a)) * s, y: cy + (by + br * Math.sin(a) * .9) * s }); }
  pts.push({ x: cx + 150 * s, y: cy + 40 * s }, { x: cx - 155 * s, y: cy + 40 * s });
  return pts;
}
function bang(t, x, y) { // "!"
  const k = P(t, 3.9, 4.0), out = P(t, 4.5, 4.62); if (k <= 0 || out >= 1) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(eback(k) * (1 - out), eback(k) * (1 - out)); ctx.rotate(.12);
  wline([{ x: 0, y: -70 }, { x: 0, y: -10 }], 14); wcircle(0, 18, 8, INK, 0);
  ctx.restore();
}
function comic(t, word, t0, x, y, rot, col) {
  const k = P(t, t0, t0 + .12), out = P(t, t0 + .75, t0 + .95); if (k <= 0 || out >= 1) return;
  ctx.save(); ctx.translate(x + jit(1) * 2, y + jit(2) * 2); ctx.rotate(rot); const s = eback(k) * (1 - out * .3); ctx.scale(s, s); ctx.globalAlpha = 1 - out;
  // burst
  const pts = Array.from({ length: 22 }, (_, i) => { const rr = (i % 2 ? 105 : 165) * (1 + .15 * hash(i * 3.3)), a = i / 22 * Math.PI * 2; return { x: rr * 1.35 * Math.cos(a), y: rr * .8 * Math.sin(a) }; });
  wpath(pts, 2, true); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
  ctx.font = '900 92px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = 14; ctx.strokeStyle = INK; ctx.strokeText(word, 0, 6); ctx.fillStyle = '#fff'; ctx.fillText(word, 0, 6);
  ctx.restore();
}
function speedLines(t, b, prev) {
  if (!b || !prev) return; const dx = b.x - prev.x, dy = b.y - prev.y, sp = Math.hypot(dx, dy); if (sp < 18) return;
  ctx.save(); ctx.globalAlpha = .6;
  for (const o of [-24, 0, 24]) { const nx = -dy / sp * o, ny = dx / sp * o; wline([{ x: b.x - dx / sp * 70 + nx, y: b.y - dy / sp * 70 + ny }, { x: b.x - dx / sp * (70 + Math.min(150, sp * 3)) + nx, y: b.y - dy / sp * (70 + Math.min(150, sp * 3)) + ny }], 4); }
  ctx.restore();
}

// ---------- frame ----------
function draw(t) {
  sid = 0; boil = Math.floor(t * 12);
  ctx.drawImage(paper, 0, 0);
  bgDoodles(t);
  const b = ball(t), bp = ball(Math.max(0, t - 1 / 30));
  const p = pose(t);
  speedLines(t, b, bp);
  const { r, lyY } = drawMan(t, p);
  if (b) drawBall(b);
  bang(t, r.head.x + 30, r.head.y - 110);
  // dizzy stars orbit the head (world coords after rotation)
  if (t > T_BONK && t < 11.6) {
    const hw = { x: p.x + (r.head.x - p.x) * Math.cos(p.rot) - (r.head.y - GROUND) * Math.sin(p.rot), y: GROUND - lyY + (r.head.x - p.x) * Math.sin(p.rot) + (r.head.y - GROUND) * Math.cos(p.rot) };
    const fade = P(t, T_BONK, T_BONK + .15) * (1 - P(t, 11.3, 11.6));
    for (let i = 0; i < 3; i++) { const a = t * 5 + i * 2.09; star(hw.x + Math.cos(a) * 85, hw.y - 60 + Math.sin(a) * 26, 22 * fade, t * 3, '#ffd34d'); }
  }
  comic(t, 'БАХ!', KICK_AT, 760, 1060, -.12, '#ffd34d');
  comic(t, 'БОНК!', T_BONK, 690, 640, .1, '#7cc6ff');
  // title / ending cards
  const fadeIn = 1 - P(t, 0, .5), fadeOut = P(t, TOTAL - .6, TOTAL);
  if (fadeIn > 0 || fadeOut > 0) { ctx.fillStyle = `rgba(247,242,230,${Math.max(fadeIn, fadeOut)})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- sound events ----------
const SFX = [];
{ let last = -1; for (let t = 0; t < 3.62; t += 1 / 240) { const k = Math.floor((walkX(t) - X0) / (45 * S) / Math.PI + .5); if (k !== last && t > .05) SFX.push([+t.toFixed(3), 'step', .55]); last = k; } }
SFX.push([3.92, 'boop', .8], [4.0, 'roll', .5], [5.25, 'swish', .5], [KICK_AT, 'kick', 1], [KICK_AT + .02, 'whoosh', .7],
  [8.45, 'fall', .6], [T_BONK, 'bonk', 1], [9.6, 'thud', 1], [9.85, 'bounce', .6], [10.35, 'bounce', .35], [9.15, 'twinkle', .5],
  [11.3, 'swish', .45], [12.0, 'pop', .6], [12.6, 'hmm', .6], [14.0, 'ding', .5]);

window.frameJPEG = t => { draw(t); return cv.toDataURL('image/jpeg', .92); };
window.META = { TOTAL, SFX, MUSIC: 'uke' };
window.READY = document.fonts.load('900 92px Inter');
if (!location.search.includes('render')) { const s = performance.now(); const loop = n => { draw(((n - s) / 1000) % TOTAL); requestAnimationFrame(loop); }; window.READY.then(() => requestAnimationFrame(loop)); }
</script></body></html>
